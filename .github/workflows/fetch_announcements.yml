name: Fetch Announcements

on:
  # Hourly schedule turned off for now; the banner is hardcoded in script.js.
  # Uncomment to turn the Google Sheets feed back on.
  # schedule:
  #   - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:  # Allow manual trigger

jobs:
  fetch-announcements:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Install dependencies
      run: npm install
    
    - name: Fetch announcements
      run: npm run fetch
    
    - name: Commit and push if changed
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add announcements.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update announcements" && git push) 
